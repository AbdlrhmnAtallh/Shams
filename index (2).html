/* ===== EDIT ME: translations ===== */
const I18N={en:{home:"Home",offers:"Offers",colors:"Colors",books:"Coloring Books",all:"All Products",heroTitle:"Color your world with imagination",heroText:"Shams brings soft, joyful art supplies — coloring books, pencils, watercolors and markers — delivered across Egypt.",shop:"Shop Now",exploreOffers:"Explore Offers",offersT:"Offers",offersS:"Special prices on our favorite picks",colorsT:"Colors",colorsS:"Pencils, watercolors, markers and more",booksT:"Coloring Books & Papers",booksS:"Coloring, drawing and activity books for every mood",allT:"All Products",search:"Search products…",sortNew:"Newest",sortLow:"Price: Low to High",sortHigh:"Price: High to Low",cat_all:"All",more:"Load more",none:"No products found",add:"Add to Cart",details:"View Details",back:"Back to shopping",qty:"Quantity",related:"You may also like",save:"You save",inStock:"In stock",left:"Only {n} left",out:"Out of stock",cart:"Your Cart",empty:"Your cart is empty",subtotal:"Subtotal",shipping:"Shipping",total:"Total",remove:"Remove",egp:"EGP",wa:"Order on WhatsApp",ms:"Order on Messenger",ig:"Order on Instagram",copiedMs:"Order copied — paste it in Messenger",copiedIg:"Order copied — paste it in an Instagram DM",orderHi:"Hello Shams, I would like to order:",orderAsk:"Please confirm my order. Thank you!",added:"Added to cart",shipNote:"Shipping is available to all of Egypt",payT:"Payment Methods",payS:"We accept Cash on Delivery, InstaPay, and Vodafone Cash.",payNote:"These are not online gateways: after you confirm your order, we send you the electronic payment instructions.",cod:"Cash on Delivery",fDesc:"Soft, colorful art supplies made to spark creativity.",links:"Explore",contact:"Contact",follow:"Follow us",rights:"All rights reserved."},

/* ===== App ===== */
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const store={get(k,d){try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let lang=store.get("shams_lang",CONFIG.defaultLang),cart=store.get("shams_cart",{}),st={cat:"all",sort:"new",q:"",n:CONFIG.pageSize},cur=null,qty=1,tt;
const t=(k,o)=>(I18N[lang][k]||k).replace("{n}",o||""),li=()=>+(lang=="ar");
const nm=p=>lang=="ar"?p.nameAr:p.nameEn,ds=p=>lang=="ar"?p.descriptionAr:p.descriptionEn;
const egp=n=>n+" "+t("egp"),pct=p=>p.originalPrice?Math.round(100-p.price/p.originalPrice*100):0,byId=id=>P.find(p=>p.id==id);
const items=()=>Object.entries(cart).map(([id,q])=>[byId(id),q]).filter(([p])=>p);
const count=()=>items().reduce((s,[,q])=>s+q,0),sub=()=>items().reduce((s,[p,q])=>s+p.price*q,0);
const img=(s,a)=>`<div class="ph"><i>📷<br>${s}</i><img src="${s}" alt="${a||""}" loading="lazy"></div>`;
document.addEventListener("load",e=>{if(e.target.tagName=="IMG")e.target.parentNode.classList.add("ok")},true);
document.addEventListener("error",e=>{if(e.target.tagName=="IMG")e.target.remove()},true);
const card=p=>`<article class="card reveal" data-a="open" data-x="${p.id}"><div class="imgw" data-a="open" data-x="${p.id}">${img(p.image,nm(p))}${p.originalPrice?`<span class="badge">-${pct(p)}%</span>`:""}</div><div class="cb"><h3>${nm(p)}</h3><p class="d">${ds(p)}</p><div class="pr"><b>${egp(p.price)}</b>${p.originalPrice?`<s>${egp(p.originalPrice)}</s>`:""}</div><div class="acts"><button class="btn sm" data-a="add" data-x="${p.id}"${p.stock?"":" disabled"}>${t("add")}</button><button class="btn ghost sm" data-a="open" data-x="${p.id}">${t("details")}</button></div></div></article>`;
const io="IntersectionObserver" in window?new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)}}),{threshold:.1}):null;
const reveal=()=>$$(".reveal:not(.in)").forEach(e=>io?io.observe(e):e.classList.add("in"));
const feat=a=>[...a].sort((x,y)=>y.isFeatured-x.isFeatured);
function renderStatic(){
$("#gOffers").innerHTML=P.filter(p=>p.isOffer).map(card).join("");
$("#gColors").innerHTML=feat(P.filter(p=>G.colors.includes(p.category))).map(card).join("");
$("#gBooks").innerHTML=feat(P.filter(p=>G.books.includes(p.category))).map(card).join("");reveal()}
function renderAll(){
const q=st.q.trim().toLowerCase();
const a=P.filter(p=>(st.cat=="all"||p.category==st.cat)&&(!q||(p.nameEn+p.nameAr+p.descriptionEn+p.descriptionAr).toLowerCase().includes(q)));
a.sort(st.sort=="low"?(x,y)=>x.price-y.price:st.sort=="high"?(x,y)=>y.price-x.price:(x,y)=>y.id-x.id);
$("#chips").innerHTML=["all",...Object.keys(CATS)].map(c=>`<button class="chip${st.cat==c?" on":""}" data-a="cat" data-x="${c}">${c=="all"?t("cat_all"):CATS[c][li()]}</button>`).join("");
$("#gAll").innerHTML=a.slice(0,st.n).map(card).join("")||`<p class="sub">${t("none")}</p>`;
$("#more").style.display=a.length>st.n?"":"none";reveal()}
function showP(){
const p=cur,imgs=[p.image,...(p.additionalImages||[])],o=pct(p),g=Object.keys(G).find(k=>G[k].includes(p.category));
$("#mbox").innerHTML=`<button class="x" data-a="close" aria-label="Close">✕</button><div class="mgrid"><div><div class="mainimg" id="mi">${img(p.image,nm(p))}</div>${imgs.length>1?`<div class="th">${imgs.map(s=>`<button data-a="swap" data-x="${s}" aria-label="${nm(p)}">${img(s)}</button>`).join("")}</div>`:""}</div><div><span class="tag">${CATS[p.category][li()]}</span><h2>${nm(p)}</h2><div class="pr big"><b>${egp(p.price)}</b>${o?`<s>${egp(p.originalPrice)}</s><span class="badge" style="position:static">-${o}%</span>`:""}</div>${o?`<p class="save">${t("save")} ${egp(p.originalPrice-p.price)}</p>`:""}<p>${ds(p)}</p><p class="stk">${p.stock>5?t("inStock"):p.stock?t("left",p.stock):t("out")}</p><div class="qrow"><span>${t("qty")}</span><div class="qty"><button data-a="qp" data-x="-1" aria-label="−">−</button><span id="qv">${qty}</span><button data-a="qp" data-x="1" aria-label="+">+</button></div></div><div class="acts"><button class="btn" data-a="addq"${p.stock?"":" disabled"}>${t("add")}</button><button class="btn ghost" data-a="close">${t("back")}</button></div></div></div><h3 class="rel">${t("related")}</h3><div class="grid">${P.filter(r=>r.id!=p.id&&G[g].includes(r.category)).slice(0,4).map(card).join("")}</div>`;reveal()}
const badge=()=>{const c=count(),b=$("#cnt");b.textContent=c;b.style.display=c?"":"none"};
function save(){store.set("shams_cart",cart);badge();const b=$("#cnt");b.classList.remove("bump");void b.offsetWidth;b.classList.add("bump")}
function add(id,n){const p=byId(id);if(!p||!p.stock)return;cart[id]=Math.min((cart[id]||0)+n,p.stock);save();renderCart();toast(t("added"))}
function chg(id,d){const p=byId(id),q=(cart[id]||0)+d;if(q<=0)delete cart[id];else cart[id]=Math.min(q,p.stock);save();renderCart()}
function renderCart(){
const a=items(),s=sub();
$("#itemsBox").innerHTML=a.length?a.map(([p,q])=>`<div class="it">${img(p.image,nm(p))}<div class="im"><b>${nm(p)}</b><span>${q} × ${egp(p.price)} = <strong>${egp(p.price*q)}</strong></span><div class="qr"><div class="qty"><button data-a="dec" data-x="${p.id}" aria-label="−">−</button><span>${q}</span><button data-a="inc" data-x="${p.id}" aria-label="+">+</button></div><button class="rm" data-a="del" data-x="${p.id}">${t("remove")}</button></div></div></div>`).join(""):`<p class="sub emp">${t("empty")}</p>`;
$("#sum").innerHTML=a.length?`<div class="row"><span>${t("subtotal")}</span><span>${egp(s)}</span></div><div class="row"><span>${t("shipping")}</span><span>${egp(CONFIG.shipping)}</span></div><p class="note" style="margin:-4px 0 0">${t("shipNote")}</p><div class="row tot"><span>${t("total")}</span><span>${egp(s+CONFIG.shipping)}</span></div><button class="btn wa" data-a="order" data-x="wa">${t("wa")}</button><button class="btn ghost" data-a="order" data-x="ms">${t("ms")}</button><button class="btn ghost" data-a="order" data-x="ig">${t("ig")}</button><p class="note">${t("payNote")}</p>`:"";badge()}
const fb=s=>{const a=document.createElement("textarea");a.value=s;document.body.append(a);a.select();try{document.execCommand("copy")}catch(e){}a.remove()};
const copy=s=>{try{navigator.clipboard.writeText(s).catch(()=>fb(s))}catch(e){fb(s)}};
const toast=m=>{const e=$("#toast");e.textContent=m;e.classList.add("on");clearTimeout(tt);tt=setTimeout(()=>e.classList.remove("on"),2200)};
function orderText(){const a=items(),s=sub();return[t("orderHi"),"",...a.map(([p,q])=>`• ${nm(p)} × ${q} — ${egp(p.price)} × ${q} = ${egp(p.price*q)}`),"",`${t("subtotal")}: ${egp(s)}`,`${t("shipping")}: ${egp(CONFIG.shipping)}`,`${t("total")}: ${egp(s+CONFIG.shipping)}`,"",t("orderAsk")].join("\n")}
function order(ch){
if(!count())return toast(t("empty"));
const m=orderText();
if(ch=="wa"){window.open(`https://wa.me/${CONFIG.whatsapp}?text=${encodeURIComponent(m)}`,"_blank","noopener");return}
copy(m);toast(t(ch=="ms"?"copiedMs":"copiedIg"));
window.open(ch=="ms"?CONFIG.messengerUrl:CONFIG.instagramUrl,"_blank","noopener")}
const drawer=o=>{$("#drawer").classList.toggle("open",o);$("#ov").classList.toggle("open",o);if(o)renderCart()};
const A={
open:x=>{cur=byId(x);qty=1;showP();$("#modal").classList.add("open");$("#modal").scrollTop=0;document.body.style.overflow="hidden"},
close:()=>{$("#modal").classList.remove("open");document.body.style.overflow="";cur=null},
add:x=>add(x,1),addq:()=>add(cur.id,qty),inc:x=>chg(x,1),dec:x=>chg(x,-1),
del:x=>{delete cart[x];save();renderCart()},
cat:x=>{st.cat=x;st.n=CONFIG.pageSize;renderAll()},
swap:x=>{$("#mi").innerHTML=img(x,nm(cur))},
qp:x=>{qty=Math.max(1,Math.min(cur.stock||1,qty+ +x));$("#qv").textContent=qty},
order};
document.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(b)A[b.dataset.a](b.dataset.x)});
$("#modal").onclick=e=>{if(e.target.id=="modal")A.close()};
document.addEventListener("keydown",e=>{if(e.key=="Escape"){A.close();drawer(false)}});
$("#cartBtn").onclick=()=>drawer(true);$("#cClose").onclick=$("#ov").onclick=()=>drawer(false);
$("#burger").onclick=()=>$("#nav").classList.toggle("open");
$("#nav").onclick=e=>{if(e.target.tagName=="A")$("#nav").classList.remove("open")};
$("#q").oninput=e=>{st.q=e.target.value;st.n=CONFIG.pageSize;renderAll()};
$("#sort").onchange=e=>{st.sort=e.target.value;renderAll()};
$("#more").onclick=()=>{st.n+=CONFIG.pageSize;renderAll()};
function setLang(l){
lang=l;store.set("shams_lang",l);
const h=document.documentElement;h.lang=l;h.dir=l=="ar"?"rtl":"ltr";
$$("[data-i]").forEach(e=>e.textContent=t(e.dataset.i));
$$("[data-ip]").forEach(e=>e.placeholder=t(e.dataset.ip));
$$(".seg button").forEach(b=>b.classList.toggle("on",b.dataset.l==l));
renderStatic();renderAll();renderCart();if(cur)showP();
document.body.animate([{opacity:.4},{opacity:1}],{duration:350})}
$$(".seg button").forEach(b=>b.onclick=()=>setLang(b.dataset.l));
$$(".logo").forEach(a=>a.innerHTML=[..."shams"].map(c=>`<span>${c}</span>`).join(""));
Object.entries({fWa:`https://wa.me/${CONFIG.whatsapp}`,fMs:CONFIG.messengerUrl,fFb:CONFIG.facebookUrl,fIg:CONFIG.instagramUrl}).forEach(([id,u])=>{const e=document.getElementById(id);e.href=u;e.target="_blank";e.rel="noopener"});
$("#yr").textContent=new Date().getFullYear();
Object.keys(cart).forEach(id=>{if(!byId(id))delete cart[id]});
setLang(lang);
</script>
</body>
